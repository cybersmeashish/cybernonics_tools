<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a_1F3864" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F3864"/></marker><marker id="a_B91C1C" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="a_475569" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="a_166534" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#166534"/></marker><marker id="a_B45309" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs><rect width="1600" height="1000" fill="#F8FAFC"/><text x="40" y="50" font-size="30" font-weight="800" fill="#1F3864">agent-honeypot · Reference Architecture</text><text x="40" y="78" font-size="16" fill="#475569">Inline guard + decoy network + OS audit → one attributable, tamper-evident evidence chain</text><rect x="30" y="115" width="360" height="555" rx="14" fill="#EEF2FF" stroke="#1F3864" stroke-width="1.5" stroke-dasharray="7 5"/><text x="46" y="141" font-size="15" font-weight="700" fill="#1F3864" font-family="Helvetica, Arial, sans-serif">① CONTROL PLANE · security team only</text><rect x="420" y="115" width="640" height="555" rx="14" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="7 5"/><text x="436" y="141" font-size="15" font-weight="700" fill="#B91C1C" font-family="Helvetica, Arial, sans-serif">② AGENT SANDBOX · untrusted</text><rect x="1090" y="115" width="480" height="555" rx="14" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5" stroke-dasharray="7 5"/><text x="1106" y="141" font-size="15" font-weight="700" fill="#B45309" font-family="Helvetica, Arial, sans-serif">③ DECOY NETWORK · isolated</text><rect x="30" y="715" width="1540" height="260" rx="14" fill="#F0FDF4" stroke="#166534" stroke-width="1.5" stroke-dasharray="7 5"/><text x="46" y="741" font-size="15" font-weight="700" fill="#166534" font-family="Helvetica, Arial, sans-serif">④ DETECTION · EVIDENCE · RESPONSE</text><rect x="50" y="155" width="320" height="105" rx="10" fill="#FFFFFF" stroke="#1F3864" stroke-width="2"/><text x="64" y="182" font-size="17" font-weight="700" fill="#1F3864">honeypots.yaml</text><text x="64" y="207" font-size="14" fill="#1E293B">Decoy catalog: kind, path, severity,</text><text x="64" y="228" font-size="14" fill="#1E293B">restricted flag, alert sinks,</text><text x="64" y="249" font-size="14" fill="#1E293B">decoy_base_url</text><rect x="50" y="285" width="320" height="115" rx="10" fill="#FFFFFF" stroke="#1F3864" stroke-width="2"/><text x="64" y="312" font-size="17" font-weight="700" fill="#1F3864">Planter · agent-honeypot plant</text><text x="64" y="337" font-size="14" fill="#1E293B">Fresh high-entropy tokens per</text><text x="64" y="358" font-size="14" fill="#1E293B">honeypot × agent instance</text><text x="64" y="379" font-size="14" fill="#1E293B">→ writes decoys into workspace</text><rect x="50" y="425" width="320" height="115" rx="10" fill="#FFFFFF" stroke="#1F3864" stroke-width="2"/><text x="64" y="452" font-size="17" font-weight="700" fill="#1F3864">Token Registry</text><text x="64" y="477" font-size="14" fill="#1E293B">token → honeypot → agent_id</text><text x="64" y="498" font-size="14" fill="#1E293B">Attribution backbone (chmod 0600)</text><text x="64" y="519" font-size="14" fill="#1E293B">NEVER mounted into the sandbox</text><rect x="50" y="565" width="240" height="85" rx="10" fill="#FFFFFF" stroke="#1F3864" stroke-width="2"/><text x="64" y="592" font-size="15" font-weight="700" fill="#1F3864">Deterrence notice (optional)</text><text x="64" y="617" font-size="14" fill="#1E293B">System-prompt warning</text><rect x="445" y="155" width="280" height="105" rx="10" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2"/><text x="459" y="182" font-size="17" font-weight="700" fill="#B91C1C">AI Agent (LLM)</text><text x="459" y="207" font-size="14" fill="#1E293B">Coding / infra / data agent</text><text x="459" y="228" font-size="14" fill="#1E293B">Mistaken · misaligned ·</text><text x="459" y="249" font-size="14" fill="#1E293B">prompt-injected</text><rect x="760" y="155" width="280" height="105" rx="10" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2"/><text x="774" y="182" font-size="17" font-weight="700" fill="#B91C1C">AgentGuard (inline)</text><text x="774" y="207" font-size="14" fill="#1E293B">Wraps every tool call</text><text x="774" y="228" font-size="14" fill="#1E293B">OUT: use / touch · IN: discover</text><text x="774" y="249" font-size="14" fill="#1E293B">Halts BEFORE secret egress</text><rect x="445" y="295" width="595" height="110" rx="10" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2"/><text x="459" y="322" font-size="17" font-weight="700" fill="#B91C1C">Tools (all wrapped by AgentGuard)</text><text x="459" y="347" font-size="14" fill="#1E293B">read_file · shell · http · git · db_query · MCP servers</text><text x="459" y="368" font-size="14" fill="#1E293B">OpenAI Agents SDK · LangChain · Strands / AgentCore · custom loops</text><rect x="445" y="440" width="595" height="210" rx="10" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2"/><text x="459" y="467" font-size="17" font-weight="700" fill="#B91C1C">Agent Workspace — planted decoys</text><text x="459" y="492" font-size="14" fill="#1E293B">•  .aws/credentials.bak — admin cloud credentials            [detect]</text><text x="459" y="513" font-size="14" fill="#1E293B">•  deploy/legacy/.env.production — DB / payments / admin       [detect]</text><text x="459" y="534" font-size="14" fill="#1E293B">•  config/admin-gateway.yaml — break-glass admin token         [detect]</text><text x="459" y="555" font-size="14" fill="#1E293B">•  docs/archive/restricted/Q3-exec-compensation.md — canary  [incriminate]</text><text x="459" y="576" font-size="14" fill="#1E293B">•  research/…/model_weights_v18 — fake weights + upload token [incriminate]</text><text x="459" y="597" font-size="14" fill="#1E293B">•  src/utils/legacy_sync.py — “peer agent” collusion invite   [incriminate]</text><text x="459" y="618" font-size="14" fill="#1E293B">   restricted dirs carry a RESTRICTED.md — not for agent use</text><rect x="1115" y="155" width="430" height="220" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/><text x="1129" y="182" font-size="17" font-weight="700" fill="#B45309">Decoy Server · agent-honeypot serve</text><text x="1129" y="207" font-size="14" fill="#1E293B">DNS aliases: decoy.internal,</text><text x="1129" y="228" font-size="14" fill="#1E293B">legacy-payroll-db.internal, model-registry.internal</text><text x="1129" y="249" font-size="14" fill="#1E293B">/v1/models/*  — fake model registry</text><text x="1129" y="270" font-size="14" fill="#1E293B">/api/v2/payroll  — fake HR records</text><text x="1129" y="291" font-size="14" fill="#1E293B">/latest/meta-data  — fake instance metadata</text><text x="1129" y="312" font-size="14" fill="#1E293B">/internal/agents/coordination  — fake swarm</text><text x="1129" y="333" font-size="14" fill="#1E293B">Canned JSON only · no proxy · read-only FS</text><rect x="1115" y="400" width="430" height="115" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/><text x="1129" y="427" font-size="17" font-weight="700" fill="#B45309">OS-level tripwires</text><text x="1129" y="452" font-size="14" fill="#1E293B">auditd rules · agent-honeypot audit-rules</text><text x="1129" y="473" font-size="14" fill="#1E293B">or eBPF (Tetragon / Falco) file watches</text><text x="1129" y="494" font-size="14" fill="#1E293B">Catches access that bypasses the tools</text><rect x="1115" y="540" width="430" height="110" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/><text x="1129" y="567" font-size="17" font-weight="700" fill="#B45309">Transcript scanner</text><text x="1129" y="592" font-size="14" fill="#1E293B">agent-honeypot scan &lt;logs&gt;</text><text x="1129" y="613" font-size="14" fill="#1E293B">Post-hoc sweep of trajectories / CoT</text><text x="1129" y="634" font-size="14" fill="#1E293B">for any decoy token</text><rect x="55" y="760" width="330" height="195" rx="10" fill="#FFFFFF" stroke="#166534" stroke-width="2"/><text x="69" y="787" font-size="17" font-weight="700" fill="#166534">HoneypotEngine</text><text x="69" y="812" font-size="14" fill="#1E293B">One record_trigger() for every path</text><text x="69" y="833" font-size="14" fill="#1E293B">attribute: observed vs planted agent</text><text x="69" y="854" font-size="14" fill="#1E293B">cross-agent flag (collusion / theft)</text><text x="69" y="875" font-size="14" fill="#1E293B">severity × action weighting</text><text x="69" y="896" font-size="14" fill="#1E293B">discover · touch · use · contact</text><rect x="415" y="760" width="330" height="195" rx="10" fill="#FFFFFF" stroke="#166534" stroke-width="2"/><text x="429" y="787" font-size="17" font-weight="700" fill="#166534">Evidence Log · hash-chained</text><text x="429" y="812" font-size="14" fill="#1E293B">SHA-256 chain, append-only JSONL</text><text x="429" y="833" font-size="14" fill="#1E293B">agent-honeypot verify → tamper check</text><text x="429" y="854" font-size="14" fill="#1E293B">Ship to WORM (S3 Object Lock)</text><text x="429" y="875" font-size="14" fill="#1E293B">+ runtime snapshot for replay</text><rect x="775" y="760" width="330" height="195" rx="10" fill="#FFFFFF" stroke="#166534" stroke-width="2"/><text x="789" y="787" font-size="17" font-weight="700" fill="#166534">Alert Bus</text><text x="789" y="812" font-size="14" fill="#1E293B">Console · JSONL → SIEM</text><text x="789" y="833" font-size="14" fill="#1E293B">Slack · generic webhook</text><text x="789" y="854" font-size="14" fill="#1E293B">→ EventBridge / SNS / PagerDuty</text><text x="789" y="875" font-size="14" fill="#1E293B">→ SOC triage queue</text><rect x="1135" y="760" width="410" height="195" rx="10" fill="#FFFFFF" stroke="#166534" stroke-width="2"/><text x="1149" y="787" font-size="17" font-weight="700" fill="#166534">Response &amp; Incrimination</text><text x="1149" y="812" font-size="14" fill="#1E293B">Kill switch: guard halt + on_halt hook</text><text x="1149" y="833" font-size="14" fill="#1E293B">agent-honeypot report → verdict:</text><text x="1149" y="854" font-size="14" fill="#1E293B">probable_mistake · suspicious · incriminating</text><text x="1149" y="875" font-size="14" fill="#1E293B">Resample · read CoT · retrain monitors</text><text x="1149" y="896" font-size="14" fill="#1E293B">Never train the agent on its own traps</text><path d="M210,260 L210,283" fill="none" stroke="#1F3864" stroke-width="2.4" marker-end="url(#a_1F3864)"/><path d="M210,400 L210,423" fill="none" stroke="#1F3864" stroke-width="2.4" marker-end="url(#a_1F3864)"/><path d="M370,342 L395,342 L395,545 L443,545" fill="none" stroke="#1F3864" stroke-width="2.4" marker-end="url(#a_1F3864)"/><text x="300" y="556" font-size="13" font-weight="700" fill="#1F3864"></text><text x="392" y="560" font-size="12" font-weight="700" fill="#1F3864">plant</text><path d="M725,207 L758,207" fill="none" stroke="#B91C1C" stroke-width="2.4" marker-end="url(#a_B91C1C)"/><path d="M900,260 L900,293" fill="none" stroke="#B91C1C" stroke-width="2.4" marker-end="url(#a_B91C1C)"/><path d="M742,405 L742,438" fill="none" stroke="#B91C1C" stroke-width="2.4" marker-end="url(#a_B91C1C)"/><text x="750" y="427" font-size="12" font-weight="700" fill="#B91C1C">read / write</text><path d="M1040,190 L1113,190" fill="none" stroke="#B91C1C" stroke-width="2.4" marker-end="url(#a_B91C1C)"/><text x="1046" y="182" font-size="12" font-weight="700" fill="#B91C1C">egress</text><path d="M1040,470 L1113,470" fill="none" stroke="#B45309" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#a_B45309)"/><text x="1044" y="462" font-size="12" font-weight="700" fill="#B45309">file</text><path d="M1040,240 L1068,240 L1068,695" fill="none" stroke="#166534" stroke-width="2.4"/><path d="M1330,650 L1330,695" fill="none" stroke="#166534" stroke-width="2.4"/><path d="M1330,695 L190,695 L190,758" fill="none" stroke="#166534" stroke-width="2.4" marker-end="url(#a_166534)"/><text x="560" y="689" font-size="13" font-weight="700" fill="#166534">trigger bus: inline (guard) · contact (decoy server) · file (auditd/eBPF) · transcript</text><path d="M330,540 L330,758" fill="none" stroke="#1F3864" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#a_1F3864)"/><text x="338" y="740" font-size="12" font-weight="700" fill="#1F3864">token lookup</text><path d="M385,857 L413,857" fill="none" stroke="#166534" stroke-width="2.4" marker-end="url(#a_166534)"/><path d="M745,857 L773,857" fill="none" stroke="#166534" stroke-width="2.4" marker-end="url(#a_166534)"/><path d="M1105,857 L1133,857" fill="none" stroke="#166534" stroke-width="2.4" marker-end="url(#a_166534)"/><path d="M1545,830 L1585,830 L1585,98 L900,98 L900,153" fill="none" stroke="#B91C1C" stroke-width="2.4" marker-end="url(#a_B91C1C)"/><text x="1300" y="92" font-size="14" font-weight="700" fill="#B91C1C">HALT · kill switch</text></svg>