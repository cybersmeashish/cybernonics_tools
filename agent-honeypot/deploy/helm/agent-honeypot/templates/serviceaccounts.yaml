{{- $fn := include "ahp.fullname" . -}}
{{- range $c := list "decoy" "planter" "tetragon-bridge" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fn }}-{{ $c }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ahp.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
