# Installed at the repository root by scripts/push-to-github.sh
# Push a tag agent-honeypot-vX.Y.Z to publish the image and the Helm chart to ghcr.io.
name: agent-honeypot release
on:
  push:
    tags: ["agent-honeypot-v*"]
permissions:
  contents: read
  packages: write
jobs:
  image-and-chart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-honeypot
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#agent-honeypot-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: agent-honeypot
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/agent-honeypot:${{ steps.vars.outputs.version }}
            ghcr.io/${{ steps.vars.outputs.owner }}/agent-honeypot:latest
      - uses: azure/setup-helm@v4
      - name: package and push chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/agent-honeypot --version "${{ steps.vars.outputs.version }}" --app-version "${{ steps.vars.outputs.version }}"
          helm push "agent-honeypot-${{ steps.vars.outputs.version }}.tgz" "oci://ghcr.io/${{ steps.vars.outputs.owner }}/charts"
